# Prometheus ServiceMonitor for Trident CSI metrics.
#
# Blog: "Create a Prometheus ServiceMonitor for Trident metrics"
#   "we create another Prometheus ServiceMonitor that watches the trident-csi
#    service and listens on the metrics port"
#
# Target in this cluster:
#   Service    trident/trident-csi
#   Labels     app=controller.csi.trident.netapp.io
#   Port       metrics = 9220 -> targetPort 8001
#
# The Prometheus CR selects this ServiceMonitor through the matching
# monitoring: trident-protect label.
#
# ก่อนใช้กับ production ให้ตรวจ Service ของ Trident CSI:
#   kubectl -n trident get svc -l app=controller.csi.trident.netapp.io -o yaml
#
# ดู spec.ports: ถ้ามี name: metrics ใช้ endpoints.port: metrics ด้านล่างได้เลย
# ถ้าชื่อ port ต่างออกไป ให้แก้ endpoints.port ให้ตรง (ใช้ชื่อ ไม่ใช่เลข port)
# ถ้าไม่พบ Service ให้ใช้: kubectl get svc -A --show-labels
# แล้วแก้ namespaceSelector.matchNames และ selector.matchLabels ให้ตรงกับที่พบ
# หมายเหตุ: ถ้าเลือก https-metrics ต้องตั้ง scheme/TLS เพิ่ม ไม่ใช่เปลี่ยนชื่อ port อย่างเดียว
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: trident-sm
  namespace: prometheus
  labels:
    monitoring: trident-protect
spec:
  jobLabel: trident
  selector:
    matchLabels:
      app: controller.csi.trident.netapp.io
  namespaceSelector:
    matchNames:
      - trident
  endpoints:
    - port: metrics
      interval: 15s
