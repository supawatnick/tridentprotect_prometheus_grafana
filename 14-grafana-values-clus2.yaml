# Helm values for Grafana on k8s-clus2.
#
# Same as 14-grafana-values.yaml with the values that are specific to this cluster:
#
#   persistence.storageClassName          sc-clus1-nfs  -> sc-clus2-nfs
# External access is configured separately in 14-grafana-external-service-clus2.yaml.
# No Service overrides here; the chart creates its default internal Service.
#
---
persistence:
  enabled: true
  type: pvc
  storageClassName: sc-clus2-nfs
  accessModes:
    - ReadWriteOnce
  size: 10Gi
