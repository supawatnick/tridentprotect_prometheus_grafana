# Alertmanager สำหรับ Trident Protect monitoring
#
# Prometheus Operator จะสร้าง StatefulSet, Pod และ Service ชื่อ alertmanager-operated
# ให้เอง เราสร้างแค่ CR และ ServiceAccount
#
# configSecret ชี้ไปที่ Secret ที่มี key alertmanager.yaml (ไฟล์ 19-alertmanager-config.yaml)
#
# namespace : prometheus
#
# ⚠️ PRODUCTION:
#   - replicas: 3
#       สำหรับ HA ถ้า pod ตาย alert ยังถูกส่งต่อได้
#   - storage:
#       volumeClaimTemplate: + storageClassName: <ชื่อ StorageClass>
#       ทำให้ alert และ silence ไม่หายเมื่อ pod restart
#   - retention: 120h
#       เก็บประวัติย้อนหลังได้นานขึ้น
#   - web:
#       tlsConfig: + httpServer: {tlsCert: ...}
#       เปิด UI ผ่าน HTTPS
#   - secrets: [smtp-credentials]
#       ถ้าจะเก็บ SMTP password เป็นไฟล์แทนการใส่ใน config
#       Secret จะถูก mount ที่ /etc/alertmanager/secrets/smtp-credentials
#       แล้วอ้างด้วย smtp_auth_password_file ในไฟล์ 19-alertmanager-config.yaml
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alertmanager
  namespace: prometheus
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/instance: alertmanager
---
apiVersion: monitoring.coreos.com/v1
kind: Alertmanager
metadata:
  name: alertmanager
  namespace: prometheus
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/instance: alertmanager
spec:
  replicas: 1
  serviceAccountName: alertmanager
  configSecret: alertmanager-config
  retention: 24h
  # ไม่กำหนด externalUrl เพราะ email templates ไม่มีลิงก์กลับ Alertmanager
