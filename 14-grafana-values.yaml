# Helm values for Grafana.
#
# Blog: "Install Grafana" + "Enable persistent storage for Grafana"
#
# Differences from the blog:
#   - persistence is enabled on the first install instead of a second helm upgrade
#   - storage class is the Trident NFS backend of this cluster
#   - external access is configured separately in 14-grafana-external-service-clus1.yaml
#   - no Service overrides here; the chart creates its default internal Service
#
# The Prometheus data source and the dashboard are added through the Grafana UI
# like in the blog, so no datasources, dashboards or sidecar settings are needed.
---
persistence:
  enabled: true
  type: pvc
  storageClassName: sc-clus1-nfs
  accessModes:
    - ReadWriteOnce
  size: 10Gi
